name: Orionsec
description: 'Orionsec (ORION Security) is a data loss prevention (DLP) platform that
  uses AI-powered, context-aware agents to detect and prevent data exfiltration across
  endpoints, SaaS, web, cloud, email, on-premises systems, storage, and print. Rather
  than relying on static policies, ORION analyzes data classification, lineage, identity,
  environment, and external relationships to cut false positives and deploy in minutes.
  The company is backed by Norwest Venture Partners and IBM Ventures and maintains a
  public trust center documenting SOC 2, ISO/IEC 27001, HIPAA, and GDPR posture. As
  of this profile, Orionsec does not publish a public developer API, reference, or
  documentation surface.'
